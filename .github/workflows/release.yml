name: Release

# Pushing a version tag (e.g. v1.2.3) builds one Velopack package per desktop OS — the Game Launcher plus
# the Godot client, as an installer, a self-updating portable zip and the update feed (full + delta
# packages) — plus one Velopack package per server arch (a self-updating Linux AppImage), publishes the
# self-updating native sim-server RELEASE image to GHCR, and attaches everything to a GitHub Release.
# Installed clients AND deployed servers update themselves from that release (launcher/, docs/RELEASING.md,
# server/docker-entrypoint.sh).
#
# Version = tag minus the leading "v". Tags containing "-" publish as a PRE-RELEASE: they do NOT move the
# :latest image tag and are only offered to players who switched the launcher to the BETA channel.
# Pre-release labels must be DOTTED (v1.2.0-rc.1, not -rc1): SemVer compares "rc10" < "rc2" as text.
#
#   prepare ──┬─► package (linux | macos | windows) ─────────────────┐
#             └─► package-server (x64 | arm64) ──┬────────────────────┼─► publish
#   server-e2e (x64 | arm64) ─────────────────────┴─► server-image ───┘
#
# Nothing becomes visible until `publish`: the release stays a draft while the OS/arch jobs run, and only
# one job (publish) ever holds `contents: write` for longer than it takes to create that draft.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  REPO_URL: https://github.com/${{ github.repository }}
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_CLI_USE_MSBUILD_SERVER: 0
  MSBUILDDISABLENODEREUSE: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # ---------------------------------------------------------------------------------------------
  # Version, release notes and the DRAFT release. Creating the draft here (once) is what lets the
  # three uploads in `publish` merge into it instead of racing to create it.
  # ---------------------------------------------------------------------------------------------
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # The launcher shows these as PATCH NOTES / WHAT'S NEW (they are embedded in the update feed by
      # `vpk pack --releaseNotes`). A hand-written changelog on a pre-created release wins; otherwise
      # GitHub's generated notes are used. The downloads boilerplate is never part of the notes.
      - name: Release notes
        run: |
          if gh release view "$GITHUB_REF_NAME" --json body --jq .body > body.md 2>/dev/null && [ -s body.md ]; then
            echo "using the existing release body"
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body > body.md
          fi
          sed '/<!-- sa:downloads -->/,/<!-- \/sa:downloads -->/d' body.md > notes.md
          cat notes.md

      - name: Create the draft release (if missing)
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md \
              ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }}
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------
  # One Velopack package per OS: Game Launcher + Godot client. Host-OS only by necessity (macOS
  # packages need codesign/pkgbuild; the launcher is NativeAOT on Windows + macOS). ALL of the real
  # work is scripts/package-clients.ps1 — the same script a developer runs locally.
  # ---------------------------------------------------------------------------------------------
  package:
    name: Package (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    # The slowest OS (macOS: universal export + two AOT publishes) needs about 10 minutes. A headless Godot
    # that never exits must not be allowed to sit on a runner for GitHub's default six hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, channel: linux }
          - { name: macOS, os: macos-latest, channel: osx }
          - { name: Windows, os: windows-latest, channel: win }
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      # Signing is optional and switched on purely by adding these secrets (docs/RELEASING.md).
      MAC_APP_IDENTITY: ${{ secrets.MAC_APP_IDENTITY }}
      MAC_INSTALL_IDENTITY: ${{ secrets.MAC_INSTALL_IDENTITY }}
      MAC_NOTARY_PROFILE: ${{ secrets.MAC_NOTARY_PROFILE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # Single source of truth for the SDK: root global.json (>= 10.0.401, which is the
          # Roslyn 5.9.0 floor tools/wire-gen needs). Bump it there, not here.
          global-json-file: global.json

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: true
          include-templates: true
          cache: true

      # vpk needs a system zstd for delta packages — without it, it silently writes bsdiff deltas that the
      # updater REJECTS (package-clients.ps1 refuses to run in that state) — and mksquashfs for the AppImage.
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zstd squashfs-tools libfontconfig1

      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: brew list zstd >/dev/null 2>&1 || brew install zstd

      - name: Restore tools and client dependencies
        run: |
          dotnet tool restore
          dotnet restore client/stellarallegiance.csproj

      # Headless Godot can SIGSEGV (exit 139) during SHUTDOWN on the Windows runner after a successful
      # build/import. Tolerate only that code here; the package script checks the real artifacts.
      - name: Generate Godot C# solution
        run: |
          ec=0
          godot --headless --path client --build-solutions --quit || ec=$?
          echo "build-solutions exit: $ec"
          if [ "$ec" -ne 0 ] && [ "$ec" -ne 139 ]; then exit "$ec"; fi

      # .glb.import sidecars are gitignored, so a fresh checkout has NO imported assets. Without an
      # explicit import pass the export packs un-imported GLBs and every model silently falls back to
      # its procedural placeholder (spheres for bases) at runtime.
      - name: Import assets
        run: |
          ec=0
          godot --headless --path client --import || ec=$?
          echo "import exit: $ec"
          if [ "$ec" -ne 0 ] && [ "$ec" -ne 139 ]; then exit "$ec"; fi
          test -f client/assets/bases/garrison.glb.import || { echo "::error::GLB import produced no sidecars — exported client would ship placeholder meshes"; exit 1; }

      # Cheap and fast, so it runs first: install → update → play with the stub game, against the REAL
      # Velopack updater (on Windows: the real Setup.exe + its --veloapp-install hook). A launcher that
      # cannot update itself must never reach players — they would be stuck on that version forever.
      - name: Launcher end-to-end test
        shell: pwsh
        run: ./scripts/launcher-e2e.ps1

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      # The previous full package is the base the DELTA is generated against. A first-ever Velopack
      # release finds nothing (that is fine: it ships without a delta). Stable tags diff against the last
      # stable release, pre-release tags against the last pre-release.
      - name: Fetch the previous release (delta base)
        run: |
          mkdir -p "build/releases/${{ matrix.channel }}"
          dotnet vpk download github --repoUrl "$REPO_URL" --channel "${{ matrix.channel }}" \
            --outputDir "build/releases/${{ matrix.channel }}" --token "${{ secrets.GITHUB_TOKEN }}" \
            ${{ needs.prepare.outputs.prerelease == 'true' && '--pre' || '' }} \
            || echo "::notice::no previous Velopack release for '${{ matrix.channel }}' — shipping without a delta"

      - name: Package ${{ matrix.name }}
        shell: pwsh
        run: ./scripts/package-clients.ps1 -Version $env:VERSION -ReleaseNotes notes.md -OutputDir "build/releases/${{ matrix.channel }}" -Ci

      # Only THIS version's files travel on: the delta base fetched above is already on the last release.
      - name: Drop the delta base
        shell: pwsh
        run: |
          Get-ChildItem "build/releases/${{ matrix.channel }}" -Filter '*.nupkg' |
            Where-Object { $_.Name -notlike "*-$env:VERSION-*" -and $_.Name -notlike "*-$env:VERSION.nupkg" } |
            Remove-Item -Force -Verbose
          Get-ChildItem "build/releases/${{ matrix.channel }}" | Format-Table Name, Length

      - name: Upload ${{ matrix.name }} package
        uses: actions/upload-artifact@v7
        with:
          name: velopack-${{ matrix.channel }}
          path: build/releases/${{ matrix.channel }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  # ---------------------------------------------------------------------------------------------
  # One Velopack package per server arch: the self-updating sim-server AppImage. Native runners only
  # (NativeAOT cannot cross-compile — see scripts/package-server.ps1, which does ALL the real work,
  # the same script a developer runs locally). Also stages server/Dockerfile.release's build context
  # (that AppImage + server/docker-entrypoint.sh) as a SEPARATE artifact for the server-image job
  # below, since that job's context can't be the repo root (server/Dockerfile.release only COPYs a
  # pre-built AppImage — see its header for why — and the repo's own .dockerignore excludes build/,
  # where vpk writes).
  # ---------------------------------------------------------------------------------------------
  package-server:
    name: Package server (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x64, os: ubuntu-latest, arch: x64 }
          - { name: arm64, os: ubuntu-24.04-arm, arch: arm64 }
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # Single source of truth for the SDK: root global.json (>= 10.0.401, which is the
          # Roslyn 5.9.0 floor tools/wire-gen needs). Bump it there, not here.
          global-json-file: global.json

      # zstd: without it vpk silently writes bsdiff deltas that the updater REJECTS
      # (package-server.ps1 refuses to run in that state). squashfs-tools: mksquashfs builds the
      # AppImage. Docker itself is already on the runner image.
      - name: Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y zstd squashfs-tools

      - name: Restore tools
        run: dotnet tool restore

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      # The previous full package is the base the DELTA is generated against — same reasoning as the
      # client package job below. A first-ever server release finds nothing (fine: ships without a
      # delta). Stable tags diff against the last stable release, pre-release tags against the last
      # pre-release. Channels are per-ARCH (server-linux-x64/arm64), never shared with each other or
      # with the client's `linux` — see scripts/package-server.ps1.
      - name: Fetch the previous release (delta base)
        run: |
          mkdir -p "build/releases/server-linux-${{ matrix.arch }}"
          dotnet vpk download github --repoUrl "$REPO_URL" --channel "server-linux-${{ matrix.arch }}" \
            --outputDir "build/releases/server-linux-${{ matrix.arch }}" --token "${{ secrets.GITHUB_TOKEN }}" \
            ${{ needs.prepare.outputs.prerelease == 'true' && '--pre' || '' }} \
            || echo "::notice::no previous Velopack release for 'server-linux-${{ matrix.arch }}' — shipping without a delta"

      - name: Package server (${{ matrix.name }})
        shell: pwsh
        run: ./scripts/package-server.ps1 -Version $env:VERSION -ReleaseNotes notes.md -OutputDir "build/releases/server-linux-${{ matrix.arch }}" -ImageContext build/server-image -Ci

      # Only THIS version's files travel on: the delta base fetched above is already on the last release.
      - name: Drop the delta base
        shell: pwsh
        run: |
          Get-ChildItem "build/releases/server-linux-${{ matrix.arch }}" -Filter '*.nupkg' |
            Where-Object { $_.Name -notlike "*-$env:VERSION-*" -and $_.Name -notlike "*-$env:VERSION.nupkg" } |
            Remove-Item -Force -Verbose
          Get-ChildItem "build/releases/server-linux-${{ matrix.arch }}" | Format-Table Name, Length

      - name: Upload server package
        uses: actions/upload-artifact@v7
        with:
          name: velopack-server-linux-${{ matrix.arch }}
          path: build/releases/server-linux-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      # compression-level 0: the payload is one AppImage (already a compressed squashfs), like the package above.
      - name: Upload staged image context
        uses: actions/upload-artifact@v7
        with:
          name: server-image-${{ matrix.arch }}
          path: build/server-image
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  # ---------------------------------------------------------------------------------------------
  # The server's counterpart of the "Launcher end-to-end test" step above: the release image, built from
  # THIS commit, must defer an update while a player is connected, apply it once empty, relaunch inside
  # the same container and stop promptly (scripts/server-update-e2e.ps1, against a local feed). A server
  # that cannot update itself stays on that version until its operator steps in, so nothing server-side
  # ships without it: it gates the image push (which moves :latest) and, through that, the publish.
  # Its own job, not a step of package-server: it runs beside the packaging instead of in front of it
  # (about 8 minutes, inside what the desktop legs take anyway), and it is the SAME definition the
  # pull-request dry-run uses - one file, called from here.
  # ---------------------------------------------------------------------------------------------
  server-e2e:
    name: Server update e2e
    uses: ./.github/workflows/server-update-dryrun.yml

  # ---------------------------------------------------------------------------------------------
  # Native sim-server RELEASE image -> GHCR: a small supervisor entrypoint plus the self-updating
  # AppImage each package-server leg just packed (server/Dockerfile.release). COPY-only, so this
  # multi-platform build needs no QEMU: buildx builds each platform's layer natively from ITS OWN
  # arch's artifact instead of emulating the other one (contrast the old server/Dockerfile build this
  # job used to do, which genuinely compiled NativeAOT and needed QEMU to cross-build).
  # ---------------------------------------------------------------------------------------------
  server-image:
    name: Server image (GHCR)
    needs: [prepare, package-server, server-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Merges BOTH package-server legs' staged contexts into one dir: ctx/amd64/…, ctx/arm64/…
      # (Docker's arch names — see scripts/package-server.ps1) plus ctx/docker-entrypoint.sh (written
      # identically by both legs from the same checkout, so the duplicate is harmless).
      - name: Download staged image contexts
        uses: actions/download-artifact@v8
        with:
          pattern: server-image-*
          path: ctx
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/stellarallegiance-sim
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ctx
          file: server/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---------------------------------------------------------------------------------------------
  # Attach every channel's package (3 desktop clients + 2 server arches, $CHANNELS below) to the
  # draft release and publish it. `vpk upload github` sends only the NEW build's files (from
  # assets.<channel>.json) plus a per-channel feed (releases.<channel>.json); the uploads run one
  # after another, in one job, so nothing races.
  # ---------------------------------------------------------------------------------------------
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [prepare, package, package-server, server-e2e, server-image]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
      # Every Velopack channel this release publishes: the three desktop client channels plus one per
      # server arch. server-linux-x64/arm64, NOT a shared "linux" — Velopack feeds are per-channel and
      # not filtered by package id, so the server channels must differ from each other and from the
      # client's (see scripts/package-server.ps1). ONE list, used by both loops below, so adding a
      # channel here can never update one loop and miss the other.
      CHANNELS: "win osx linux server-linux-x64 server-linux-arm64"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # Single source of truth for the SDK: root global.json (>= 10.0.401, which is the
          # Roslyn 5.9.0 floor tools/wire-gen needs). Bump it there, not here.
          global-json-file: global.json

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: velopack-*

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes

      # Re-running a failed publish must work: vpk refuses to upload when the channel's feed file is
      # already on the release, so clear whatever a previous attempt left behind first.
      - name: Remove assets from a previous attempt
        run: |
          for ch in $CHANNELS; do
            for f in "dist/velopack-$ch"/*; do
              gh release delete-asset "$GITHUB_REF_NAME" "$(basename "$f")" -y >/dev/null 2>&1 || true
            done
          done
          gh release delete-asset "$GITHUB_REF_NAME" RELEASES -y >/dev/null 2>&1 || true

      - name: Upload packages
        run: |
          dotnet tool restore
          for ch in $CHANNELS; do
            dotnet vpk upload github --repoUrl "$REPO_URL" --token "$GH_TOKEN" --outputDir "dist/velopack-$ch" \
              --channel "$ch" --tag "$GITHUB_REF_NAME" --releaseName "$GITHUB_REF_NAME" --merge \
              ${{ needs.prepare.outputs.prerelease == 'true' && '--pre' || '' }}
          done

      # Body = the notes (hand-written or generated) + the downloads/self-hosting block. The block is
      # wrapped in markers so `prepare` can strip it again when a release is re-run.
      - name: Publish
        run: |
          base="$REPO_URL/releases/download/$GITHUB_REF_NAME"
          {
            cat notes.md
            echo
            echo "<!-- sa:downloads -->"
            echo "## Install"
            echo
            echo "Installed copies update themselves — you only ever download an installer once."
            echo
            echo "- **Windows** — [StellarAllegiance-win-Setup.exe]($base/StellarAllegiance-win-Setup.exe). Installs per-user (no admin prompt) and adds Start menu + desktop shortcuts. Unsigned: SmartScreen will ask once (*More info → Run anyway*)."
            echo "- **macOS** — [StellarAllegiance-osx-Portable.zip]($base/StellarAllegiance-osx-Portable.zip). Unzip, **drag *Stellar Allegiance* into Applications**, then run it from there. Ad-hoc signed (not notarized): clear quarantine once with \`xattr -dr com.apple.quarantine \"/Applications/Stellar Allegiance.app\"\`. (A \`.pkg\` is attached too — choose *Install for me only*: an all-users install is owned by root, and every update would then ask for an admin password.)"
            echo "- **Linux** — [StellarAllegiance.AppImage]($base/StellarAllegiance.AppImage). \`chmod +x\` it, keep it somewhere writable (it replaces itself when it updates), and run it."
            echo
            echo "Coming from a pre-launcher zip build (v0.0.12 or older)? Install once with the link above; your settings and sign-in are kept."
            echo
            echo "## Self-hosting a game server"
            echo
            echo "Run the published image (pairs with \`docker-compose.server.yml\` in the repo):"
            echo
            echo '```'
            echo "docker pull ghcr.io/${{ github.repository_owner }}/stellarallegiance-sim:$VERSION"
            echo '```'
            echo
            echo "Set \`SIM_PUBLIC_NAME\` to be listed in the public server browser. See \`docker-compose.server.yml\` for the full env/NAT configuration."
            echo
            echo "**This image self-updates.** Once no player is connected it downloads and applies the next release in place and relaunches itself — no redeploy needed. Set \`SIM_AUTO_UPDATE=warn\` to only log that an update is available instead, or \`off\` to disable the check entirely (see \`docker-compose.server.yml\` / \`.env.example\`)."
            echo
            echo "A server still running a PRE-auto-update image won't pick this feature up on its own — pull and recreate it once: \`docker compose -f docker-compose.server.yml pull && docker compose -f docker-compose.server.yml up -d\`. From there it updates itself going forward."
            echo
            echo "Not using Docker? Bare Linux AppImages are attached below too — [StellarAllegianceServer-server-linux-x64.AppImage]($base/StellarAllegianceServer-server-linux-x64.AppImage) / [-arm64]($base/StellarAllegianceServer-server-linux-arm64.AppImage). \`chmod +x\` and run (needs the \`fusermount\` helper: \`apt install fuse3\`). Outside a container the default is \`SIM_AUTO_UPDATE=warn\`; set \`SIM_AUTO_UPDATE=on\` and it updates itself the same way (systemd unit in \`docs/DEPLOY.md\`)."
            echo "<!-- /sa:downloads -->"
          } > body.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --notes-file body.md \
            --prerelease=${{ needs.prepare.outputs.prerelease }} \
            --latest=${{ needs.prepare.outputs.prerelease == 'true' && 'false' || 'true' }}
