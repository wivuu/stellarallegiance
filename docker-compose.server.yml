# Standalone GAME-SERVER deploy: runs ONLY the sim-server and publishes it to the HOSTED public
# lobby (no local lobby container). Use this to host a community game server that shows up in the
# shared server browser.
#
#   docker compose -f docker-compose.server.yml up
#
# Discovery is DIRECT-FIRST: the hosted lobby probes your server's public address and, if reachable,
# advertises a direct host:port so clients connect straight to you over WebSocket (no traffic through
# the lobby). If it can't reach you (NAT, no port-forward), clients fall back to WebRTC + public STUN.
# There is NO TURN relay — forward the game port for the widest reach.
#
# IMPORTANT (NAT / single box): the lobby probes from the public internet, but your container's
# source IP is a private 172.x address, so by default you'd only be reachable via the WebRTC/STUN
# fallback. To be listed as DIRECT: (a) forward the game port (default 8090) on your router, and
# (b) set SIM_PUBLIC_ENDPOINT to your reachable public address — e.g. SIM_PUBLIC_ENDPOINT=1.2.3.4:8090,
# or a scheme'd https://your-domain when a TLS proxy fronts you.
#
# TLS: the sim server speaks plain ws:// on :8090; put a TLS proxy in front for wss:// in production.
#
# AUTH (device code): first boot with SIM_PUBLIC_NAME set prints a one-time code + approval URL
# and stays UNLISTED until an Operator opens it and approves — that's what "hosted by" now comes
# from (the SIM_HOSTED_BY free-text label is gone). The resulting credential is written to
# SIM_AUTH_FILE; the volume below keeps it on a rebuild so you only approve once.
#
# First run:
#   cp .env.example .env && edit .env   (set SIM_PUBLIC_NAME; set SIM_PUBLIC_ENDPOINT if NAT'd)
#   docker compose -f docker-compose.server.yml up
#   # watch the logs for the device-code banner and approve it at the printed URL
services:
  sim-server:
    # The published release image (server/Dockerfile.release): a small supervisor entrypoint plus a
    # Velopack AppImage that SELF-UPDATES — see SIM_AUTO_UPDATE below. Pin an exact tag instead of
    # :latest for a reproducible deploy (auto-update still moves you forward regardless of the tag
    # you pulled, unless SIM_AUTO_UPDATE is warn/off).
    image: ghcr.io/wivuu/stellarallegiance-sim:latest
    # Alternative: build from source instead of pulling the image (server/Dockerfile — the same
    # NativeAOT build CI runs). A source build never applies its own binary in place, so
    # SIM_AUTO_UPDATE below only ever logs (Warn), regardless of its setting.
    # build:
    #   context: .                     # repo root, so ../shared resolves (see server/Dockerfile)
    #   dockerfile: server/Dockerfile
    environment:
      # Optional shared-secret password. Leave empty for an open server (LAN/dev); set it to
      # require every client's Hello to carry the same secret.
      SIM_SECRET: ${SIM_SECRET:-}
      # Set to 1 to skip the lobby ready-up and run a perpetual match (bots / benchmarking).
      SIM_AUTOSTART: ${SIM_AUTOSTART:-}
      # REQUIRED to be listed: 3-50 char public name. Empty = private (joinable only by direct address).
      SIM_PUBLIC_NAME: ${SIM_PUBLIC_NAME:-}
      # The HOSTED public lobby this server registers with.
      PUBLIC_LOBBY: ${PUBLIC_LOBBY:-https://stellarlobby.wivuu.com}
      # Public-facing port the lobby probes/advertises (default = listen port; set when a
      # port-forward maps a different external port).
      SIM_PUBLIC_PORT: ${SIM_PUBLIC_PORT:-}
      # Your reachable public address so the lobby can advertise you as DIRECT (see header). For a
      # NAT'd / single-box host this is effectively required: host:port or https://domain.
      SIM_PUBLIC_ENDPOINT: ${SIM_PUBLIC_ENDPOINT:-}
      # Persisted Game Server credential (device-code auth) — kept on the volume below so a
      # rebuild/restart re-lists silently instead of asking you to approve a new code.
      SIM_AUTH_FILE: /data/lobby-auth.json
      # off|warn|on. on (the image's own default) = swap in a downloaded update once no player is
      # connected and relaunch; warn = only log that an update is available; off = never check. A
      # PINNED image tag above still self-updates unless you set this to warn/off — auto-update
      # replaces the running AppImage, not the tag docker-compose pulled it from.
      SIM_AUTO_UPDATE: ${SIM_AUTO_UPDATE:-}
    volumes:
      - sim-server-auth:/data
      # Optional: persist Velopack's own download cache across `docker compose up`/container
      # recreation, so a later update fetches a small DELTA instead of a full package again. Safe to
      # omit — without it, only in-place updates within one container's lifetime stay deltas.
      # - velopack-cache:/var/tmp/velopack
    ports:
      - "${SIM_PORT:-8090}:8090"
    # The entrypoint's own graceful shutdown (docker-entrypoint.sh forwarding SIGTERM, the host
    # draining players) budgets up to ~30s; Docker's default stop_grace_period is only 10s and would
    # SIGKILL mid-drain.
    stop_grace_period: 45s
    restart: unless-stopped

volumes:
  sim-server-auth:
  # velopack-cache:
