    name: Sm Shield 1
    description: "A small-ship mounted shield protection system."
    model-name: acs30
    mass: 2
    max-strength: 51.4286   # IGC 150 × 0.342857
    regen-rate: 0.6857      # IGC 2 × 0.342857 (~75 s empty → full)
    required-capabilities: [base]
    obsoleted-by-techs: [sm-shield-2]
    successor-part-id: sm-shield-2
  - id: sm-shield-2
    name: Sm Shield 2
    description: "A small-ship mounted shield protection system."
    model-name: acs30
    mass: 2
    max-strength: 61.7143   # IGC 180 × 0.342857
    regen-rate: 1.0286      # IGC 3 × 0.342857
    required-capabilities: [base]
    required-techs: [sm-shield-2]
    obsoleted-by-techs: [sm-shield-3]
    successor-part-id: sm-shield-3
  - id: sm-shield-3
