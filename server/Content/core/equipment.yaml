  # the header). A full 1440-energy Scout pool (1200 × Iron's 1.2) lasts ~26 s cloaked against its
  # 60/s recharge. ----
  - id: sig-cloak-1
    name: Sig Cloak 1
    description: "Cloaking device"
    model-name: acs38
    mass: 3
    energy-consumption: 115    # energy/s while engaged (IGC)
    max-cloaking: 0.625        # signature × (1 − 0.625) at full cloak (IGC)
    on-rate: 0.25              # full cloak in 4 s
    off-rate: 0.25
    required-capabilities: [base]
