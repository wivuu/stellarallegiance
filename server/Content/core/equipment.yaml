# Equipment — the per-ship SLOTS: one shield, one afterburner and one cloak per ship, picked in the
# hangar. A hull's `allowed-parts` (hulls.yaml, keys shield / afterburner / cloak) decides which
# slots it has and what fits them; a listed part implicitly allows its whole successor chain, so a
# hull allowed Sm Shield 1 carries Sm Shield 2/3 once researched. Its `preferred-parts` pick each
# slot's default: the first listed part the slot allows whose required-techs the hull itself already
# requires (Allegiance's TryToBuyParts rule — a research-locked part is never handed out free).
# Equipment costs NO payload and does not change flight mass; `mass` is display-only. Each part
# projects to a runtime EquipmentDef whose id is its position in this file's order — shields, then
# afterburners, then cloaks (0-8, 9-15, 16) — so APPEND within a section, never reorder.
#
# Iron Coalition equipment (PCore014.igc), translated with the rules the hulls and guns already use:
#   - shields: max-strength AND regen-rate = IGC maxStrength / regeneration × 0.342857 (= 12/35, the
#     hull-point factor: our Enh Fighter's 120 armor / the IGC Enh Fighter's 350), so shields keep
#     their IGC share of a ship's toughness. No recharge-delay is authored: 0 = Allegiance's
#     continuous regen (the shield recovers even under fire).
#   - afterburners: max-thrust = IGC maxThrust ÷ 30 — the SAME rule that gives hull `thrust` (IGC
#     thrust ÷ 30), so boosted top speed = speed × (1 + max-thrust ÷ thrust) keeps Allegiance's
#     ratio (shipIGC.cpp:2940-2990). fuel-consumption = the IGC fuelConsumption coefficient × IGC
#     maxThrust = fuel/second at full burn; tanks (hulls.yaml max-fuel) are raw IGC values.
#   - cloak: energy-consumption and max-cloaking are raw IGC values (the hull energy pools are raw
#     too). Signature × (1 − cloaking) at full cloak.
# Values are the exact parsed IGC floats through those rules, rounded to 4 decimals.
#
# `signature` is deliberately left out of every part. Allegiance authors part signatures (Booster 1
# 2.0, Sm Shield 0.5, …) but never applies them — a ship's signature is its hull's × (1 − cloaking),
# shipIGC.h:270. Authoring one here would make it live (an additive per-ship bias).
#
# Not ported:
#   - Retro Booster: negative thrust; CoreValidator refuses max-thrust <= 0.
#   - Sig Cloak 2 (110/s, 0.70) and 3 (105/s, 0.76): researched at the Tactical base, which the
#     game doesn't have yet — so Sig Cloak 1 is the top tier here.
#   - Hvy Cloak 1/2 (200 and 180/s, 0.90): stealth hulls only (unported).
# The Scout's cloak slot is a deliberate stand-in: in PCore014 no ported Iron hull can cloak (only the
# unported Stealth Fighter can), so the Scout carries Sig Cloak 1 until the stealth hulls land.
#
# Tier succession mirrors the gun lines: each non-top tier carries obsoleted-by-techs (the next tier's
# tech — once owned the hangar hides this tier) + successor-part-id (what an equipped tier migrates
# to). Research lives in developments.yaml (group EQUIPMENT).
shields:
