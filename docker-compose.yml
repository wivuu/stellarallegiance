# Local-dev / single-box deployment of the stellarallegiance backend:
#   sim-server    the 20 Hz authoritative match + lobby host (clients connect & download content)
#   public-lobby  the PUBLIC LOBBY: identity issuer + game-server registry + WebRTC signaling relay
#   lobby-db      Postgres 17: the lobby's system of record (players, sessions, matches, ladder)
#
# Discovery is DIRECT-FIRST: when a sim-server registers, the lobby probes its port and, if it's
# reachable, advertises a direct host:port — clients then connect straight to it over WebSocket (no
# traffic through the lobby). A server that isn't reachable (NAT, no port-forward) falls back to
# WebRTC + public STUN, with only the tiny SDP handshake relayed through public-lobby. There is no
# TURN relay — clients that can't hole-punch a NAT'd server can't join it (forward a port for the
# widest reach).
#
# NOTE (single-box compose): the lobby probes the sim-server's container IP here, so the advertised
# endpoint is only reachable on this host's docker network — fine for local/dev. For a real
# deployment run public-lobby on its own public box; player servers then probe from their real IP.
#
# TLS: the sim server speaks plain ws:// on :8090; production terminates TLS at the ingress.
#
# First run:
#   cp .env.example .env && edit .env
#   docker compose up --build
services:
  sim-server:
    build:
      context: .                     # repo root, so ../shared resolves (see server/Dockerfile)
      dockerfile: server/Dockerfile
    environment:
      # Optional shared-secret password. Leave empty for an open server (LAN/dev); set it to
      # require every client's Hello to carry the same secret.
      SIM_SECRET: ${SIM_SECRET:-}
      # Set to 1 to skip the lobby ready-up and run a perpetual match (bots / benchmarking).
      SIM_AUTOSTART: ${SIM_AUTOSTART:-}
      # Public-lobby publishing (opt-in): set SIM_PUBLIC_NAME (3-50 chars) to register this server
      # with the lobby below so clients can discover + WebRTC-join it. Empty = private (direct only).
      # First boot prints a device code and stays unlisted until approved at the lobby's /device
      # page; the resulting credential is written to SIM_AUTH_FILE (default beside sim-cache/,
      # inside this container — mount a volume there if you want it to survive a container rebuild
      # instead of pairing again on every `up --build`).
      SIM_PUBLIC_NAME: ${SIM_PUBLIC_NAME:-}
      PUBLIC_LOBBY: ${PUBLIC_LOBBY:-public-lobby:8091}
      # Public-facing port the lobby probes/advertises (default = listen port; set when a
      # port-forward maps a different external port).
      SIM_PUBLIC_PORT: ${SIM_PUBLIC_PORT:-}
      # Optional host:port this server asserts as its reachable address (e.g. the host's LAN/public
      # address when it's behind container NAT or a proxy). The lobby probes it and advertises it
      # only if it answers /health. Unset = the lobby uses the registration source IP.
      SIM_PUBLIC_ENDPOINT: ${SIM_PUBLIC_ENDPOINT:-}
    ports:
      - "${SIM_PORT:-8090}:8090"
    depends_on:
      - public-lobby
    restart: unless-stopped

  # Public lobby: identity issuer (accounts, passkeys, device codes, join tokens), game-server
  # registry + WebRTC signaling relay (no game traffic flows through it), match ledger + ladder.
  # On register it probes each server's port to decide direct-vs-WebRTC; it hands out the STUN
  # config below for the WebRTC fallback. Requires Postgres (lobby-db); migrations run first via
  # the one-shot lobby-migrate service (`dotnet PublicLobby.dll --migrate`, idempotent).
  public-lobby:
    build:
      context: .                     # repo root, so it builds uniformly with sim-server / railway up
      dockerfile: public-lobby/Dockerfile
    environment:
      SHARE_PORT: 8091
      ConnectionStrings__postgres-database: Host=lobby-db;Username=lobby;Password=${LOBBY_DB_PASSWORD:-lobby};Database=lobby
      # Public URL players and servers reach this lobby at: the join-token issuer, the device-code
      # approval link and the passkey relying-party domain all derive from it. Must equal the
      # PUBLIC_LOBBY base the sim server dials.
      LOBBY_PUBLIC_URL: ${LOBBY_PUBLIC_URL:-http://localhost:8091}
      # Comma list of admin logins (github:<login>, google:<sub>, steam:<steamid>, name:<display>).
      LOBBY_ADMINS: ${LOBBY_ADMINS:-}
      # External logins are optional — passkeys always work. Set a pair to enable a provider.
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GITHUB_CLIENT_ID: ${AUTH_GITHUB_CLIENT_ID:-}
      AUTH_GITHUB_CLIENT_SECRET: ${AUTH_GITHUB_CLIENT_SECRET:-}
      AUTH_STEAM_API_KEY: ${AUTH_STEAM_API_KEY:-}
      # flagged (default): only admin-flagged Ranked servers move the global ladder; authenticated:
      # every verified server does.
      RANKED_RESULTS: ${RANKED_RESULTS:-flagged}
      # true accepts listings from servers that never authenticated (badged Unverified, no results).
      ALLOW_UNVERIFIED_SERVERS: ${ALLOW_UNVERIFIED_SERVERS:-false}
      # Dev only: grant_type=dev + GET /login/dev — never set in production.
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-}
      # Public STUN handed to clients/servers for the WebRTC fallback (covers ~80% of NATs via
      # hole-punching). Comma-separate several to list fallbacks, e.g. "stun:a:3478,stun:b:19302".
      STUN_URL: ${STUN_URL:-stun:stun.cloudflare.com:3478}
    ports:
      - "${SHARE_PORT:-8091}:8091"
    depends_on:
      lobby-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: apply the lobby's EF Core + Orleans migrations (creates the database if absent).
  lobby-migrate:
    build:
      context: .
      dockerfile: public-lobby/Dockerfile
    command: ["dotnet", "PublicLobby.dll", "--migrate"]
    environment:
      ConnectionStrings__postgres-database: Host=lobby-db;Username=lobby;Password=${LOBBY_DB_PASSWORD:-lobby};Database=lobby
    depends_on:
      lobby-db:
        condition: service_healthy
    restart: "no"

  lobby-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lobby
      POSTGRES_PASSWORD: ${LOBBY_DB_PASSWORD:-lobby}
      POSTGRES_DB: lobby
    volumes:
      - lobby-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lobby -d lobby"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  lobby-db-data:
